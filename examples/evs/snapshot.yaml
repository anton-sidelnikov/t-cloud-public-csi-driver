# Snapshot of the evs-data claim from filesystem.yaml and a new claim restored
# from it. Needs the snapshot CRDs; the VolumeSnapshotClass tcloud-public-evs
# is installed with the driver.
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshot
metadata:
  name: evs-data-snap
spec:
  volumeSnapshotClassName: tcloud-public-evs
  source:
    persistentVolumeClaimName: evs-data
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: evs-data-restore
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: evs-ssd
  resources:
    requests:
      storage: 10Gi
  dataSource:
    apiGroup: snapshot.storage.k8s.io
    kind: VolumeSnapshot
    name: evs-data-snap
