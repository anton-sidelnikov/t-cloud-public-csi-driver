# EVS SSD disk mounted as ext4 in one pod.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: evs-ssd
provisioner: csi.evs.tcloudpublic.com
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
parameters:
  volumeType: SSD
  csi.storage.k8s.io/fstype: ext4
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: evs-data
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: evs-ssd
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: evs-app
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: [sh, -c, "date >> /data/log.txt && sync && tail -f /dev/null"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: evs-data
