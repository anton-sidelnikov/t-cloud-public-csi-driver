# EVS disk encrypted with a KMS key. Replace the kmsKeyId value with the ID of
# an enabled key in the same project (evs/default or a custom key).
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: evs-ssd-encrypted
provisioner: csi.evs.tcloudpublic.com
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
parameters:
  volumeType: SSD
  kmsKeyId: 00000000-0000-0000-0000-000000000000
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: evs-encrypted
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: evs-ssd-encrypted
  resources:
    requests:
      storage: 10Gi
