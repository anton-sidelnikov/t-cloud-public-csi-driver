# SFS General Purpose file system mounted by two pods (ReadWriteMany). Access is
# allowed from OS_VPC_ID in the cloud secret, or from vpcId set here. The size
# is not enforced.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gpsfs
provisioner: csi.gpsfs.tcloudpublic.com
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
# parameters:
#   vpcId: <VPC ID>
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: gpsfs-shared
spec:
  accessModes: [ReadWriteMany]
  storageClassName: gpsfs
  resources:
    requests:
      storage: 100Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpsfs-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gpsfs-app
  template:
    metadata:
      labels:
        app: gpsfs-app
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: [sh, -c, "echo $HOSTNAME >> /data/hosts.txt && tail -f /dev/null"]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: gpsfs-shared
