# An existing SFS Turbo file system used as a volume. Replace SHARE_ID with the
# file system ID from the console. Retain keeps the file system when the claim
# is deleted.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: sfsturbo-existing
spec:
  capacity:
    storage: 500Gi
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  csi:
    driver: csi.sfsturbo.tcloudpublic.com
    volumeHandle: SHARE_ID
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sfsturbo-existing
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ""
  volumeName: sfsturbo-existing
  resources:
    requests:
      storage: 500Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: sfsturbo-existing
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: [sh, -c, "ls -la /data && tail -f /dev/null"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: sfsturbo-existing
