# A directory of an existing SFS Turbo file system used as a volume. Replace
# SHARE_ID with the file system ID; the directory "team-a" must already exist.
# Such volumes are never deleted or expanded by the driver.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: sfsturbo-team-a
spec:
  capacity:
    storage: 100Gi
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  csi:
    driver: csi.sfsturbo.tcloudpublic.com
    volumeHandle: SHARE_ID:team-a
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sfsturbo-team-a
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ""
  volumeName: sfsturbo-team-a
  resources:
    requests:
      storage: 100Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: sfsturbo-team-a
spec:
  containers:
    - name: app
      image: busybox:1.36
      command: [sh, -c, "ls -la /data && tail -f /dev/null"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: sfsturbo-team-a
