# SFS Turbo Standard share mounted by two pods (ReadWriteMany). The zone,
# VPC, subnet and security group come from OS_AVAILABILITY_ZONE, OS_VPC_ID,
# OS_SUBNET_ID and OS_SECURITY_GROUP_ID in the cloud secret, or set them here.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: sfsturbo-standard
provisioner: csi.sfsturbo.tcloudpublic.com
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  shareType: STANDARD
  # vpcId: <VPC ID>
  # subnetId: <subnet network ID>
  # securityGroupId: <security group ID>
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sfsturbo-shared
spec:
  accessModes: [ReadWriteMany]
  storageClassName: sfsturbo-standard
  resources:
    requests:
      storage: 500Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sfsturbo-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sfsturbo-app
  template:
    metadata:
      labels:
        app: sfsturbo-app
    spec:
      containers:
        - name: app
          image: busybox:1.36
          command: [sh, -c, "echo $HOSTNAME >> /data/hosts.txt && tail -f /dev/null"]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: sfsturbo-shared
