apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: tcloud-public-evs-zone-mismatch
provisioner: csi.evs.tcloudpublic.com
reclaimPolicy: Delete
volumeBindingMode: WaitForFirstConsumer
parameters:
  volumeType: SSD
  # Must not match any cluster node zone; provisioning is expected to fail.
  availabilityZone: eu-de-99
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: evs-zone-mismatch-pvc
  namespace: tcloud-public-csi-manual
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: tcloud-public-evs-zone-mismatch
---
apiVersion: v1
kind: Pod
metadata:
  name: evs-zone-mismatch-pod
  namespace: tcloud-public-csi-manual
spec:
  restartPolicy: Never
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "tail -f /dev/null"]
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: evs-zone-mismatch-pvc
