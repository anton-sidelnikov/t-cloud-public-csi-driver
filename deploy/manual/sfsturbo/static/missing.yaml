# A bound static volume of a share that does not exist, for the health monitor check.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: sfsturbo-manual-static-missing
spec:
  capacity:
    storage: 500Gi
  accessModes: [ReadWriteMany]
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  claimRef:
    namespace: tcloud-public-csi-manual-sfsturbo
    name: sfsturbo-static-missing
  csi:
    driver: csi.sfsturbo.tcloudpublic.com
    volumeHandle: 00000000-0000-0000-0000-000000000000
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sfsturbo-static-missing
  namespace: tcloud-public-csi-manual-sfsturbo
spec:
  accessModes: [ReadWriteMany]
  storageClassName: ""
  volumeName: sfsturbo-manual-static-missing
  resources:
    requests:
      storage: 500Gi
