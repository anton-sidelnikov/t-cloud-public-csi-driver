apiVersion: v1
kind: Pod
metadata:
  name: sfsturbo-reader
spec:
  restartPolicy: Never
  containers:
    - name: app
      image: busybox:1.36
      command:
        - sh
        - -c
        - |
          set -eu
          until [ -s /data/shared.txt ]; do sleep 2; done
          cat /data/shared.txt
          df -h /data
          tail -f /dev/null
      volumeMounts:
        - name: data
          mountPath: /data
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: sfsturbo-pvc
