apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
# Adds the external health monitor, which reports abnormal volumes as events on their
# PersistentVolumeClaims. The SFS Turbo and SFS General Purpose backends report volume health.
resources:
  - rbac.yaml
replacements:
  - source:
      kind: ServiceAccount
      name: tcloud-public-csi-controller-sa
      fieldPath: metadata.name
    targets:
      - select:
          kind: ClusterRoleBinding
          name: tcloud-public-csi-external-health-monitor.SERVICE_ACCOUNT
        fieldPaths:
          - metadata.name
        options:
          delimiter: "."
          index: 1
patches:
  - target:
      kind: Deployment
    patch: |-
      - op: add
        path: /spec/template/spec/containers/-
        value:
          name: csi-external-health-monitor-controller
          image: registry.k8s.io/sig-storage/csi-external-health-monitor-controller:v0.18.0
          args:
            - --csi-address=$(ADDRESS)
            - --leader-election
            - --leader-election-namespace=$(POD_NAMESPACE)
          env:
            - name: ADDRESS
              value: /csi/csi.sock
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          volumeMounts:
            - name: socket-dir
              mountPath: /csi
