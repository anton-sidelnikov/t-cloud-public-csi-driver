apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: tcloud-public-csi-external-health-monitor-role
rules:
  - apiGroups: [""]
    resources: ["persistentvolumes", "persistentvolumeclaims", "nodes", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch", "create", "patch"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "watch", "list", "delete", "update", "create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: tcloud-public-csi-external-health-monitor-binding
subjects:
  - kind: ServiceAccount
    name: tcloud-public-csi-controller-sa
    namespace: tcloud-public-csi-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: tcloud-public-csi-external-health-monitor-role
