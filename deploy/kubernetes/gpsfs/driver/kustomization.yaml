apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tcloud-public-csi-gpsfs
nameSuffix: -gpsfs
resources:
  - ../../base
patches:
  - path: controller.yaml
  - path: node.yaml
  - path: rbac.yaml
  - target:
      kind: Deployment
      name: tcloud-public-csi-controller
    patch: |-
      - op: replace
        path: /spec/selector/matchLabels/app
        value: tcloud-public-csi-controller-gpsfs
      - op: replace
        path: /spec/template/metadata/labels/app
        value: tcloud-public-csi-controller-gpsfs
  - target:
      kind: DaemonSet
      name: tcloud-public-csi-node
    patch: |-
      - op: replace
        path: /spec/selector/matchLabels/app
        value: tcloud-public-csi-node-gpsfs
      - op: replace
        path: /spec/template/metadata/labels/app
        value: tcloud-public-csi-node-gpsfs
